<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>صفحه دوم</title>
  <link rel="stylesheet" href="style.css">
  <script src="bridge.js"></script>
</head>
<body>
  <h1>📄 صفحه دوم</h1>
  <div class="card">
    <p>این صفحه‌ی دوم است. دکمه‌ی زیر (یا دکمه‌ی Back گوشی) شما را به صفحه اصلی برمی‌گرداند.</p>
    <button class="btn" onclick="App.exitOrBack()">بازگشت</button>
    <button class="btn secondary" onclick="App.toast('سلام از صفحه دوم')">Toast</button>
  </div>
</body>
</html>
